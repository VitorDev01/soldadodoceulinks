<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soldado do Céu</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
    margin:0;
    padding:30px;
    background:#020b0a;
    color:white;
    text-align:center;
    font-family:'Share Tech Mono', monospace;
}

.profile-container{
    max-width:500px;
    margin:auto;
}

.profile-photo{
    position:relative;
    width:180px;
    height:180px;
    margin:auto;
}

.profile-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;

    border:3px solid #ffcc00;

    box-shadow:
        0 0 10px #ffcc00,
        0 0 25px #ff8800,
        0 0 50px #ff3300,
        0 0 80px #ff0000;
}

.spark{
  position:absolute;
  width:14px;
  height:1px;

  background:linear-gradient(
    90deg,
    #ffff99,
    #ffdd00,
    #ff5500,
    transparent
  );

  border-radius:50%;

  opacity:0;
  animation:sparkFly 1.5s linear infinite;


    box-shadow:
        0 0 5px #ffff66,
        0 0 10px #ffcc00,
        0 0 20px #ff6600,
        0 0 30px #ff0000;

    animation:sparkMove 1.5s linear infinite;
}

.s1{ --r:0deg; animation-delay:0s; }
.s2{ --r:60deg; animation-delay:.2s; }
.s3{ --r:120deg; animation-delay:.4s; }
.s4{ --r:180deg; animation-delay:.6s; }
.s5{ --r:240deg; animation-delay:.8s; }
.s6{ --r:300deg; animation-delay:1s; }

@keyframes sparkMove{

    0%{
        opacity:1;

        transform:
        translate(-50%,-50%)
        rotate(var(--r))
        translateY(0)
        scale(1);
    }

    100%{
        opacity:0;

        transform:
        translate(-50%,-50%)
        rotate(var(--r))
        translateY(-140px)
        scale(.2);
    }
}

h1{
    margin-top:25px;

    color:#ffcc00;

    text-shadow:
        0 0 5px #ffcc00,
        0 0 15px #ff8800,
        0 0 25px #ff3300;
}

.subtitle{
    margin-bottom:30px;

    color:#ffb347;

    text-shadow:0 0 5px #ff8800;
}

.matrix-btn{

    width:100%;
    max-width:450px;

    height:55px;

    margin:15px auto;

    display:flex;
    justify-content:center;
    align-items:center;

    text-decoration:none;

    color:#ffcc00;

    border-radius:8px;

    border:2px solid #ff8800;

    background:linear-gradient(
        90deg,
        rgba(255,120,0,.25),
        rgba(255,40,0,.10)
    );

    box-shadow:
        0 0 10px #ff8800,
        inset 0 0 8px #ff5500;

    transition:.3s;
}

.matrix-btn:hover{

    background:#ff8800;
    color:#000;

    transform:scale(1.03);

    box-shadow:
        0 0 15px #ffcc00,
        0 0 30px #ff8800,
        0 0 60px #ff3300;
}

@media(max-width:600px){

    .profile-photo{
        width:150px;
        height:150px;
    }

    h1{
        font-size:22px;
    }

    .matrix-btn{
        height:50px;
        font-size:15px;
    }
}

</style>
</head>

<body>

<div class="profile-container">

    <div class="profile-photo">

        <img src="foto.jpg" alt="Soldado do Céu">

        <span class="spark s1"></span>
        <span class="spark s2"></span>
        <span class="spark s3"></span>
        <span class="spark s4"></span>
        <span class="spark s5"></span>
        <span class="spark s6"></span>

    </div>

    <h1>⚔️ Soldado do Céu ⚔️</h1>

    <p class="subtitle">
        Libertação • Cortes • Conteúdo Cristão
    </p>

    <a href="LINK_DO_EBOOK" class="matrix-btn">
        <i class="fa-solid fa-book-bible"></i>&nbsp;E-book Drive
    </a>

    <a href="LINK_DO_INSTAGRAM" class="matrix-btn">
        <i class="fa-brands fa-instagram"></i>&nbsp; Adm Instagram
    </a>

    <a href="LINK_DO_YOUTUBE" class="matrix-btn">
        <i class="fa-brands fa-youtube"></i>&nbsp;YouTube
    </a>

</div>

</body>
</html>
