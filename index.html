<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soldado do Céu | Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --gold: #d4af37;
    --gold-light: #f0d78c;
    --gold-dark: #a67c00;
    --bronze: #b87333;
    --cream: #f8f1e3;
    --soft-white: rgba(255, 252, 245, 0.92);
    --text-dark: #1a1a1a;
    --accent-red: #8b1a1a;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-image: url("soldado.jpg");
    background-size: cover;
    background-position: center 20%;
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--cream);
    overflow-x: hidden;
    position: relative;
  }

  /* Soft overlay for readability – lighter & more professional */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(
      135deg,
      rgba(15, 12, 10, 0.55) 0%,
      rgba(30, 20, 15, 0.35) 40%,
      rgba(20, 15, 12, 0.50) 100%
    );
    z-index: 0;
  }

  /* Subtle warm glow at bottom inspired by the diamond reflection */
  body::after {
    content: "";
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40%;
    background: linear-gradient(
      to top,
      rgba(212, 175, 55, 0.08),
      transparent
    );
    pointer-events: none;
    z-index: 0;
  }

  .profile-container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    padding: 40px 28px;
    margin: 20px;
    background: rgba(18, 14, 12, 0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 24px;
    border: 1px solid rgba(212, 175, 55, 0.25);
    box-shadow:
      0 25px 50px -12px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.05) inset;
  }

  /* Decorative thin gold line */
  .profile-container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    border-radius: 0 0 4px 4px;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 1.7rem;
    letter-spacing: 3px;
    color: var(--gold-light);
    text-align: center;
    margin-bottom: 8px;
    text-shadow: 0 2px 12px rgba(212, 175, 55, 0.35);
  }

  .subtitle {
    text-align: center;
    font-weight: 300;
    font-size: 0.95rem;
    letter-spacing: 1.5px;
    color: rgba(248, 241, 227, 0.75);
    margin-bottom: 36px;
    line-height: 1.5;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 32px;
    opacity: 0.6;
  }

  /* Buttons – clean & professional */
  .matrix-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    height: 54px;
    margin-bottom: 14px;
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    color: var(--cream);
    background: linear-gradient(
      145deg,
      rgba(212, 175, 55, 0.12),
      rgba(184, 115, 51, 0.08)
    );
    border: 1px solid rgba(212, 175, 55, 0.35);
    border-radius: 14px;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
  }

  .matrix-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      120deg,
      transparent 30%,
      rgba(255, 255, 255, 0.08) 50%,
      transparent 70%
    );
    transform: translateX(-100%);
    transition: transform 0.6s ease;
  }

  .matrix-btn:hover {
    background: linear-gradient(
      145deg,
      rgba(212, 175, 55, 0.28),
      rgba(184, 115, 51, 0.18)
    );
    border-color: var(--gold);
    color: #fff;
    transform: translateY(-2px);
    box-shadow:
      0 8px 24px rgba(212, 175, 55, 0.2),
      0 0 0 1px rgba(212, 175, 55, 0.15);
  }

  .matrix-btn:hover::before {
    transform: translateX(100%);
  }

  .matrix-btn i {
    font-size: 1.15rem;
    color: var(--gold-light);
    transition: color 0.3s;
  }

  .matrix-btn:hover i {
    color: #fff;
  }

  /* Footer note */
  .footer {
    margin-top: 28px;
    text-align: center;
    font-size: 0.75rem;
    letter-spacing: 1px;
    color: rgba(248, 241, 227, 0.45);
    font-weight: 300;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .profile-container {
      padding: 32px 20px;
      margin: 16px;
      border-radius: 20px;
    }

    h1 {
      font-size: 1.35rem;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 0.88rem;
      margin-bottom: 28px;
    }

    .matrix-btn {
      height: 50px;
      font-size: 0.9rem;
    }
  }
</style>
</head>
<body>
  <div class="profile-container">
    <h1>Δ Soldado do Céu Ω</h1>
    <p class="subtitle">Libertação · Cortes · Conteúdo Cristão</p>
    
    <div class="divider"></div>

    <a href="https://www.tiktok.com/@soldadodoceu2000" class="matrix-btn" target="_blank" rel="noopener">
      <i class="fa-brands fa-tiktok"></i>
      TikTok
    </a>

    <a href="https://t.me/libertacaosexualalmacorpo" class="matrix-btn" target="_blank" rel="noopener">
      <i class="fa-brands fa-telegram"></i>
      Telegram
    </a>

    <a href="https://www.instagram.com/vitordev01?igsh=MTZzNmQ2MXl2YjFqMg==" class="matrix-btn" target="_blank" rel="noopener">
      <i class="fa-brands fa-instagram"></i>
      Instagram
    </a>

    <a href="https://www.youtube.com/channel/UChOtnMLwrSupYi3twqNe9ng" class="matrix-btn" target="_blank" rel="noopener">
      <i class="fa-brands fa-youtube"></i>
      YouTube
    </a>

    <p class="footer">Soldado do Céu © 2026</p>
  </div>
</body>
</html>
