<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soldado do Céu</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background-image:url("soldado.jpg");
    background-size:cover;          /* ocupa toda a tela */
    background-position:center;     /* centraliza */
    background-repeat:no-repeat;
    background-attachment:fixed;    /* fundo fixo */

    color:white;
    text-align:center;

    font-family:'Share Tech Mono', monospace;

    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:rgba(0,0,0,0.55);

    z-index:-1;
}

    .profile-container{
    position:relative;
    z-index:1;

    width:100%;
    max-width:500px;
    padding:20px;
    }

.profile-container{
    width:100%;
    max-width:500px;
    padding:20px;
}

/* FOTO */

.profile-photo{
    position:relative;
    width:190px;
    height:190px;
    margin:auto;
}

.profile-photo img{
    width:100%;
    height:100%;

    object-fit:cover;
    border-radius:50%;

    border:3px solid #ffcc00;

    animation:pulsePhoto 2s infinite;

    box-shadow:
        0 0 10px #ffcc00,
        0 0 25px #ff8800,
        0 0 50px #ff3300;
}

@keyframes pulsePhoto{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.04);

        box-shadow:
            0 0 20px #ffdd00,
            0 0 40px #ff9900,
            0 0 70px #ff3300,
            0 0 100px #ff0000;
    }

    100%{
        transform:scale(1);
    }
}

/* FAÍSCAS */

.spark{
    position:absolute;

    width:8px;
    height:1px;

    background:linear-gradient(
        90deg,
        #ffffcc,
        #ffdd00,
        #ff7700,
        transparent
    );

    border-radius:999px;

    opacity:0;

    filter:
        drop-shadow(0 0 2px #ffff00)
        drop-shadow(0 0 4px #ff8800);

    animation:sparkMove 1.3s linear infinite;
}

.s1{ --r:0deg; animation-delay:0s; }
.s2{ --r:60deg; animation-delay:.2s; }
.s3{ --r:120deg; animation-delay:.4s; }
.s4{ --r:180deg; animation-delay:.6s; }
.s5{ --r:240deg; animation-delay:.8s; }
.s6{ --r:300deg; animation-delay:1s; }

@keyframes sparkMove{

    0%{
        opacity:1;

        transform:
        translate(-50%,-50%)
        rotate(var(--r))
        translateY(0)
        scale(1);
    }

    100%{
        opacity:0;

        transform:
        translate(-50%,-50%)
        rotate(var(--r))
        translateY(-170px)
        scale(.1);
    }
}

/* TÍTULO */

h1{
    margin-top:25px;

    font-size:34px;

    color:#ffdd66;

    letter-spacing:2px;

    text-shadow:
        0 0 10px #ffcc00,
        0 0 20px #ff8800,
        0 0 35px #ff3300;
}

/* SUBTÍTULO */

.subtitle{
    margin-top:10px;
    margin-bottom:35px;

    color:#ffbb55;

    font-size:17px;

    text-shadow:
        0 0 5px #ff8800;
}

/* BOTÕES */

.matrix-btn{

    width:100%;
    max-width:450px;

    height:58px;

    margin:15px auto;

    display:flex;
    justify-content:center;
    align-items:center;

    text-decoration:none;

    color:#ffdd66;

    font-size:18px;

    border-radius:10px;

    border:1px solid #ff8800;

    background:linear-gradient(
        90deg,
        rgba(255,120,0,.25),
        rgba(255,40,0,.10)
    );

    box-shadow:
        0 0 10px #ff8800,
        inset 0 0 8px #ff5500;

    transition:.3s;
}

.matrix-btn:hover{

    background:#ff8800;

    color:#000;

    transform:translateY(-2px);

    box-shadow:
        0 0 15px #ffcc00,
        0 0 30px #ff8800,
        0 0 60px #ff3300;
}

@media(max-width:600px){

    .profile-photo{
        width:160px;
        height:160px;
    }

    h1{
        font-size:26px;
    }

    .subtitle{
        font-size:15px;
    }

    .matrix-btn{
        height:52px;
        font-size:16px;
    }
}

</style>

</head>

<body>

<div class="profile-container">

    <h1>Δ Soldado do Céu Ω</h1>

    <p class="subtitle">
        Libertação - Cortes - Conteúdo Cristão
    </p>

    <a href="https://drive.google.com/file/d/1BSbLyifd7EPpP_W9BXWL3zC_oNKyQgtn/view?usp=drive_link" class="matrix-btn">
        E-book Drive&nbsp;<i class="fa-solid fa-book-bible"></i>
    </a>

    <a href="https://www.instagram.com/vitordev01?igsh=MTZzNmQ2MXl2YjFqMg==" class="matrix-btn">
        Adm Instagram&nbsp;&nbsp;<i class="fa-brands fa-instagram"></i> 
    </a>

    <a href="https://youtube.com/@vitor_oliveira8?si=CGC2OUmqjzoyZV2S" class="matrix-btn">
        You Tube&nbsp;<i class="fa-brands fa-youtube"></i>
    </a>

</div>

</body>
</html>
